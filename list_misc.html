<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Miscellaneous | CampusSync</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Inter', sans-serif; }
        .list-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-top: 50px; }
        .header-bar { background: #0ea5e9; color: white; padding: 20px; border-radius: 15px 15px 0 0; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card list-card">
        <div class="header-bar d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Miscellaneous Archives</h5>
            <button class="btn btn-sm btn-outline-light" onclick="location.href='admin_dashboard.html'">Dashboard</button>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="bg-light small text-muted">
                    <tr><th>TOKEN</th><th>TITLE</th><th>CATEGORY</th><th>ACTION</th></tr>
                </thead>
                <tbody id="listBody"></tbody>
            </table>
        </div>
    </div>
</div>
<script>
    function renderList() {
        const tickets = JSON.parse(localStorage.getItem('campusTickets')) || [];
        const filtered = tickets.filter(t => t.status === "Misc");
        const container = document.getElementById('listBody');
        container.innerHTML = filtered.length ? "" : "<tr><td colspan='4' class='text-center py-5'>No miscellaneous items.</td></tr>";
        filtered.forEach(t => {
            container.innerHTML += `<tr><td class="font-weight-bold">#${t.id}</td><td>${t.title}</td><td>${t.category}</td><td><button class="btn btn-sm btn-info" onclick="location.href='admin_ticket_detail.html?id=${t.id}'">View</button></td></tr>`;
        });
    }
    window.onload = renderList;
</script>
</body>
</html>
