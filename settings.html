<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account & Activity Hub | CampusSync</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
  <style>
    :root { --primary: #0f172a; --accent: #2563eb; --light: #f1f5f9; --border: #e2e8f0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--light); color: #334155; }
    
    .navbar { background-color: var(--primary) !important; padding: 1rem 0; border-bottom: 3px solid var(--accent); }
    
    /* Elegant Profile Hero */
    .profile-hero { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 30px; border: 1px solid var(--border); }
    .hero-banner { height: 140px; background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%); position: relative; }
    .hero-banner::after { content: ""; position: absolute; width: 100%; height: 100%; background: url('https://www.transparenttextures.com/patterns/cubes.png'); opacity: 0.1; }
    
    .profile-meta { margin-top: -70px; padding: 0 40px 40px; position: relative; z-index: 2; }
    .profile-img-container { position: relative; width: 140px; height: 140px; }
    .profile-preview { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 6px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
    .upload-btn { position: absolute; bottom: 8px; right: 8px; background: var(--accent); color: white; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid white; transition: 0.3s; }
    .upload-btn:hover { background: #1d4ed8; transform: scale(1.1); }

    /* Navigation Pills Styling */
    .nav-pills-custom .nav-link { color: #64748b; font-weight: 700; border-radius: 12px; padding: 14px 28px; transition: 0.3s; margin-right: 12px; background: #fff; border: 1px solid var(--border); }
    .nav-pills-custom .nav-link.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
    
    .settings-card { background: white; border-radius: 20px; padding: 40px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.03); }

    /* Activity Items Enhancement */
    .activity-item { border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-bottom: 20px; transition: 0.3s; background: #fff; }
    .activity-item:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    
    /* Form Refinement */
    .label-mini { font-size: 0.75rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; display: block; }
    .form-control { border-radius: 12px; border: 1.5px solid var(--border); padding: 14px 18px; height: auto !important; transition: 0.3s; font-size: 0.95rem; }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); outline: none; }
    
    .btn-save { background: var(--primary); color: white; font-weight: 800; padding: 16px; border-radius: 14px; border: none; width: 100%; transition: 0.3s; letter-spacing: 1px; }
    .btn-save:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2); }

    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .track-link { font-size: 0.85rem; font-weight: 800; color: var(--accent); text-decoration: none; border-bottom: 2px solid transparent; transition: 0.2s; }
    .track-link:hover { border-bottom-color: var(--accent); color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand font-weight-bold" href="student_dashboard.html"><i class="fas fa-layer-group mr-2"></i> CampusSync</a>
    <button class="btn btn-outline-light btn-sm rounded-pill px-4" onclick="location.href='student_dashboard.html'"><i class="fas fa-arrow-left mr-2"></i> Dashboard</button>
  </div>
</nav>

<div class="container py-5">
  
  <div class="profile-hero">
    <div class="hero-banner"></div>
    <div class="profile-meta d-flex align-items-end flex-wrap">
      <div class="profile-img-container">
        <img id="settingsProfilePic" src="https://ui-avatars.com/api/?name=User&background=2563eb&color=fff" class="profile-preview">
        <label for="profileUpload" class="upload-btn"><i class="fas fa-camera"></i></label>
        <input type="file" id="profileUpload" hidden accept="image/*" onchange="syncProfileImage(this)">
      </div>
      <div class="ml-sm-4 mt-3 mt-sm-0 flex-grow-1">
        <h1 id="displayUserName" class="font-weight-bold h2 mb-1">Student User</h1>
        <p class="text-muted mb-0"><i class="fas fa-hashtag mr-1"></i> <span id="displayRoll" class="font-weight-bold">---</span> • <i class="fas fa-check-circle text-success ml-2"></i> Active Portal</p>
      </div>
      <button class="btn btn-outline-danger btn-sm font-weight-bold px-3 mt-3 mt-lg-0" onclick="logout()">LOGOUT</button>
    </div>
  </div>

  <ul class="nav nav-pills nav-pills-custom mb-4" role="tablist">
    <li class="nav-item"><a class="nav-link active" data-toggle="pill" href="#tab-account">Account Configuration</a></li>
    <li class="nav-item"><a class="nav-link" data-toggle="pill" href="#tab-complaints" onclick="loadActivity()">Complaint History</a></li>
    <li class="nav-item"><a class="nav-link" data-toggle="pill" href="#tab-queries" onclick="loadActivity()">Inquiry Logs</a></li>
  </ul>

  <div class="tab-content">
    
    <div class="tab-pane fade show active" id="tab-account">
      <div class="settings-card">
        <div class="row">
          <div class="col-md-6 mb-4">
            <label class="label-mini">Full Identity Name</label>
            <input type="text" id="inputName" class="form-control" placeholder="Ex: Rahul Sharma">
          </div>
          <div class="col-md-6 mb-4">
            <label class="label-mini">Enrollment / Roll Number</label>
            <input type="text" id="inputRoll" class="form-control" placeholder="Format: PTU-202X-XXXX">
          </div>
          <div class="col-md-12 mb-4">
            <label class="label-mini">Primary University Email</label>
            <input type="email" id="inputEmail" class="form-control" placeholder="example.name@ptu.ac.in">
            <small class="text-muted mt-2 d-block">Official University ID required for complaint verification.</small>
          </div>
          <div class="col-md-6 mb-4">
            <label class="label-mini">Current Semester</label>
            <select class="form-control" id="inputSem">
              <option value="">-- Choose Semester --</option>
              <option>Semester 1-2</option>
              <option>Semester 3-4</option>
              <option>Semester 5-6</option>
              <option>Semester 7-8</option>
            </select>
          </div>
          <div class="col-md-6 mb-4">
            <label class="label-mini">Personal Contact</label>
            <input type="text" id="inputContact" class="form-control" placeholder="+91 XXXX-XXXXXX">
          </div>
        </div>
        <button class="btn btn-save" onclick="saveAllSettings()">SYNC PROFILE & DATA</button>
      </div>
    </div>

    <div class="tab-pane fade" id="tab-complaints">
      <div class="settings-card">
        <h4 class="font-weight-bold mb-4">Recorded Grievances</h4>
        <div id="complaintLog"></div>
      </div>
    </div>

    <div class="tab-pane fade" id="tab-queries">
      <div class="settings-card">
        <h4 class="font-weight-bold mb-4">Academic Inquiries</h4>
        <div id="queryLog"></div>
      </div>
    </div>

  </div>
</div>

<script>
    window.onload = function() {
        loadData();
        loadActivity();
    };

    function loadData() {
        document.getElementById('inputName').value = localStorage.getItem('userName') || "";
        document.getElementById('displayUserName').innerText = localStorage.getItem('userName') || "Student User";
        document.getElementById('inputRoll').value = localStorage.getItem('userRoll') || "";
        document.getElementById('displayRoll').innerText = localStorage.getItem('userRoll') || "PTU-ID-PENDING";
        document.getElementById('inputEmail').value = localStorage.getItem('userEmail') || "";
        document.getElementById('inputContact').value = localStorage.getItem('userContact') || "";
        if(localStorage.getItem('profileImageData')) document.getElementById('settingsProfilePic').src = localStorage.getItem('profileImageData');
    }

    function loadActivity() {
        const tickets = JSON.parse(localStorage.getItem('campusTickets')) || [];
        const queries = JSON.parse(localStorage.getItem('campusQueries')) || [];
        renderList('complaintLog', tickets, 'complaint');
        renderList('queryLog', queries, 'query');
    }

    function renderList(target, items, type) {
        const container = document.getElementById(target);
        if (items.length === 0) {
            container.innerHTML = `<div class="text-center py-5 text-muted"><i class="fas fa-folder-open fa-2x mb-3"></i><br>No ${type} logs available.</div>`;
            return;
        }

        container.innerHTML = "";
        items.forEach(item => {
            const status = item.status || "Open";
            const date = item.timestamp ? new Date(item.timestamp).toLocaleDateString('en-GB') : new Date().toLocaleDateString('en-GB');
            const page = type === 'complaint' ? 'ticket_detail.html' : 'query_detail.html';

            container.innerHTML += `
                <div class="activity-item d-flex justify-content-between align-items-center">
                    <div>
                        <div class="mb-2">
                            <span class="status-dot ${status === 'Resolved' ? 'bg-success' : 'bg-warning'}"></span>
                            <span class="badge ${status === 'Resolved' ? 'badge-success' : 'badge-warning'}">${status}</span>
                            <span class="ml-2 label-mini">TOKEN: #${item.id || 'N/A'}</span>
                        </div>
                        <h5 class="font-weight-bold mb-1">${item.category || (type.toUpperCase())}</h5>
                        <p class="text-muted small mb-0">${item.description || 'Details under review...'}</p>
                    </div>
                    <div class="text-right">
                        <div class="label-mini">Submission Date</div>
                        <div class="font-weight-bold text-dark mb-2">${date}</div>
                        <a href="${page}?id=${item.id}" class="track-link">TRACK STATUS <i class="fas fa-chevron-right ml-1"></i></a>
                    </div>
                </div>`;
        });
    }

    function saveAllSettings() {
        localStorage.setItem('userName', document.getElementById('inputName').value);
        localStorage.setItem('userRoll', document.getElementById('inputRoll').value);
        localStorage.setItem('userEmail', document.getElementById('inputEmail').value);
        localStorage.setItem('userContact', document.getElementById('inputContact').value);
        alert("✅ System Profile Synchronized Successfully!");
        location.reload();
    }

    function syncProfileImage(input) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = (e) => {
                localStorage.setItem('profileImageData', e.target.result);
                document.getElementById('settingsProfilePic').src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function logout() { if(confirm("Terminate administrative session?")) window.location.href = "login.html"; }
</script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
